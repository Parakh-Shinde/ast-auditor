name: AST Auditor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run tests
        run: python -m pytest -q

      - name: Validate JSON and SARIF output
        run: |
          python -m ast_auditor --format json samples/vulnerable_example.py > /tmp/report.json
          python -m ast_auditor --format sarif samples/vulnerable_example.py > /tmp/report.sarif
          python -m json.tool /tmp/report.json > /dev/null
          python -m json.tool /tmp/report.sarif > /dev/null
          echo "JSON and SARIF syntax checks passed"
