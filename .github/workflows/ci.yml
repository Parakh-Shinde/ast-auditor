name: AST Auditor CI

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check src tests scripts

      - name: Run tests
        run: python -m pytest -q

      - name: Validate rule registry output
        run: python -m ast_auditor --list-rules > /tmp/rules.json && python -m json.tool /tmp/rules.json > /dev/null

      - name: Validate JSON and SARIF output
        run: |
          set +e
          python -m ast_auditor --format json examples/vulnerable_python.py > /tmp/report.json
          json_status=$?
          python -m ast_auditor --format sarif examples/vulnerable_python.py > /tmp/report.sarif
          sarif_status=$?
          set -e

          python -m json.tool /tmp/report.json > /dev/null
          python -m json.tool /tmp/report.sarif > /dev/null

          python - <<'PYTHON'
          import json

          with open("/tmp/report.json", encoding="utf-8") as file:
              report = json.load(file)

          with open("/tmp/report.sarif", encoding="utf-8") as file:
              sarif = json.load(file)

          assert report.get("findings_count", 0) > 0, (
              "Expected security findings in the JSON report"
          )
          results = [
              result
              for run in sarif.get("runs", [])
              for result in run.get("results", [])
          ]

          assert results, "Expected security findings in the SARIF report"

          for run in sarif.get("runs", []):
              driver = run.get("tool", {}).get("driver", {})
              declared_rule_ids = {
                  rule["id"] for rule in driver.get("rules", [])
              }
              result_rule_ids = {
                  result["ruleId"]
                  for result in run.get("results", [])
                  if "ruleId" in result
              }

              undeclared_rule_ids = result_rule_ids - declared_rule_ids
              assert not undeclared_rule_ids, (
                  "SARIF results reference undeclared rules: "
                  f"{sorted(undeclared_rule_ids)}"
              )

          print(
              "JSON and SARIF are valid, contain findings, "
              "and all SARIF rule references are declared."
          )

          PYTHON

          test "$json_status" -eq 1 || {
            echo "Expected JSON scan exit code 1; got $json_status"
            exit 1
          }
          test "$sarif_status" -eq 1 || {
            echo "Expected SARIF scan exit code 1; got $sarif_status"
            exit 1
          }

          echo "JSON and SARIF validation passed."

      - name: Validate SARIF 2.1.0 schema
        run: |
          python -m pip install jsonschema
          test -s /tmp/report.sarif
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json \
            --output /tmp/sarif-schema.json

          python - <<'PYTHON'
          import json
          from jsonschema.validators import validator_for

          with open("/tmp/sarif-schema.json", encoding="utf-8") as file:
              schema = json.load(file)
          with open("/tmp/report.sarif", encoding="utf-8") as file:
              report = json.load(file)

          validator_type = validator_for(schema)
          validator_type.check_schema(schema)
          errors = sorted(
              validator_type(schema).iter_errors(report),
              key=lambda error: tuple(
                  str(part) for part in error.absolute_path
              ),
          )

          if errors:
              for error in errors[:20]:
                  location = "/".join(map(str, error.absolute_path)) or "<root>"
                  print(f"SARIF schema error at {location}: {error.message}")
              raise SystemExit(
                  f"SARIF schema validation failed: {len(errors)} error(s)"
              )

          print("PASS: SARIF conforms to the official 2.1.0 schema")
          PYTHON

      - name: Build and inspect release distributions
        run: |
          python -m pip install build
          python -m build --sdist --wheel

          python - <<'PYTHON'
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          sdists = list(dist.glob("ast_auditor-*.tar.gz"))
          wheels = list(dist.glob("ast_auditor-*.whl"))

          assert len(sdists) == 1, f"Expected one source archive, found {sdists}"
          assert len(wheels) == 1, f"Expected one wheel, found {wheels}"

          required = {
              "MANIFEST.in",
              "README.md",
              "LICENSE",
              "CHANGELOG.md",
              "CONTRIBUTING.md",
              "SCALING_GUIDE.md",
              "SECURITY_REVIEW.md",
              "examples/vulnerable_python.py",
              "scripts/benchmark_repository_scan.py",
              "samples/vulnerable_example.py",
          }

          with tarfile.open(sdists[0], "r:gz") as archive:
              included = {
                  "/".join(Path(name).parts[1:])
                  for name in archive.getnames()
                  if len(Path(name).parts) > 1
              }

          missing = required - included
          assert not missing, f"Source archive missing: {sorted(missing)}"

          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_files = set(archive.namelist())

          assert "ast_auditor/command_line.py" in wheel_files
          assert "ast_auditor/security_scanner.py" in wheel_files

          print("PASS: source archive includes required release files")
          print("PASS: wheel includes the CLI and scanner")
          PYTHON
