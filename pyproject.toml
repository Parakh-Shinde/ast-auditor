[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ast-auditor"
version = "0.3.0"
description = "A rule-registry-driven AST security scanner for Python repositories."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "jsonschema>=4.0",
]

[project.scripts]
ast-auditor = "ast_auditor.command_line:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"examples/alias_tracking_demo.py" = ["S102"]
"examples/scope_demo.py" = ["S102"]
"examples/vulnerable_python.py" = ["S102"]
"samples/vulnerable_example.py" = ["S102"]
